<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valiant Dex</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Valiant Dex</a>
      <nav>
        <a href="pokedex/index.html">Pokédex</a>
        <a href="moves/index.html">Moves</a>

      </nav>
    </div>
  </header>
  <main class="wrap">
<section class="hero">
  <h1>Valiant Dex</h1>
  <p>Expansion-native documentation generated by Obstagoon.</p>
  <div class="stats-grid">
    <div class="card"><strong>1025</strong> <span>Species</span></div>
    <div class="card"><strong>934</strong> <span>Moves</span></div>
    <div class="card"><strong>310</strong> <span>Abilities</span></div>
    <div class="card"><strong>878</strong> <span>Items</span></div>
    <div class="card"><strong>439</strong> <span>Encounter Areas</span></div>
  </div>
</section>
  </main>
  <script>
    function obstagoonBindFilters() {
      const inputs = document.querySelectorAll('[data-filter-input]');
      inputs.forEach((input) => {
        const selector = input.getAttribute('data-filter-target');
        const emptyTextSelector = input.getAttribute('data-filter-empty');
        const items = Array.from(document.querySelectorAll(selector || ''));
        const emptyNode = emptyTextSelector ? document.querySelector(emptyTextSelector) : null;
        const apply = () => {
          const query = (input.value || '').trim().toLowerCase();
          let visible = 0;
          items.forEach((item) => {
            const haystack = (item.getAttribute('data-search-text') || item.textContent || '').toLowerCase();
            const match = !query || haystack.includes(query);
            item.style.display = match ? '' : 'none';
            if (match) visible += 1;
          });
          if (emptyNode) {
            emptyNode.style.display = visible === 0 ? '' : 'none';
          }
        };
        input.addEventListener('input', apply);
        apply();
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', obstagoonBindFilters);
    } else {
      obstagoonBindFilters();
    }
  </script>
</body>
</body>
</html>
